# This is a basic workflow to help you get started with Actions
name: Channel_Telgram_sender

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Triggers the workflow on push or pull request events but only for the "main" branch
  #push:
    #branches: [ "main" ]
  #pull_request:
    #branches: [ "main" ]
  #  push:
  #    branches:
  #      - main
  schedule:
    - cron: "0 */6 * * *" 
    
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
    
      # Runs a single command using the runners shell
      - name: Run_Python_script
      
        uses: actions/setup-python@v2
        with:
            python-version: '3.x'  # نسخه پایتونی را که می خواهید استفاده کنید تنظیم کنید، توصیه می شود از نسخه پایدار استفاده کنید

      - name: requirements
        run: |
          python -m pip install --upgrade pip
          pip install telebot jdatetime requests pytz
          
      - name: Run_Telegram_Send_PM_TO_Channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          API_KEY_BSCSCAN: ${{ secrets.API_KEY_BSCSCAN }}
          API_KEY_ETHERSCAN:  ${{ secrets.API_KEY_ETHERSCAN }}
          
          #ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: |
          python Telegram_Send_PM_TO_Channel.py
